name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm ci --ignore-scripts

      - name: Audit web production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint and type-check web applications
        run: |
          npm run lint
          npm run typecheck

      - name: Test and build web applications
        run: |
          npm test
          npm run build

      - name: Restore .NET dependencies
        run: dotnet restore DisplayControl.slnx --locked-mode

      - name: Audit .NET dependencies
        run: dotnet list DisplayControl.slnx package --vulnerable --include-transitive --no-restore

      - name: Build .NET
        run: dotnet build DisplayControl.slnx --configuration Release --no-restore

      - name: Verify .NET formatting and migration drift
        run: |
          dotnet format DisplayControl.slnx --verify-no-changes --no-restore
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/DisplayControl.SqlServerMigrations/DisplayControl.SqlServerMigrations.csproj --startup-project src/DisplayControl.Api/DisplayControl.Api.csproj --context DisplayControlDbContext --configuration Release --no-build

      - name: Test .NET
        run: dotnet test DisplayControl.slnx --configuration Release --no-build --no-restore --logger "trx;LogFilePrefix=tests" --results-directory artifacts/test-results

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify complete publish artifacts
        run: |
          dotnet publish src/DisplayControl.Api --configuration Release --no-restore --output artifacts/publish/api
          dotnet publish src/DisplayControl.DeviceAgent --configuration Release --no-restore --output artifacts/publish/agent
          test -s artifacts/publish/api/wwwroot/index.html
          test -s artifacts/publish/agent/wwwroot/index.html

      - name: Run browser and accessibility tests
        run: npm run test:e2e

      - name: Verify documentation and traceability
        shell: pwsh
        run: ./scripts/verify-docs.ps1

      - name: Validate deployment scripts
        shell: pwsh
        run: ./scripts/verify-powershell.ps1

      - name: Validate Linux shell scripts
        run: for script in deploy/pi/*.sh deploy/production/*.sh; do bash -n "$script" || exit; done

      - name: Validate local service definition
        env:
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: ci-configuration-validation-only-123!
          SQLSERVER_APP_PASSWORD: ci-runtime-validation-only-123!
        run: docker compose config --quiet

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-evidence
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 14
